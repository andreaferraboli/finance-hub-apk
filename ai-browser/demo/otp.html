<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banca Demo IT - Verifica</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body>
  <header class="top"><span class="brand">Banca Demo IT</span><span class="demo-tag">DEMO</span></header>
  <main>
    <div class="login-box panel">
      <h1>Verifica in due passaggi</h1>
      <p>Abbiamo inviato un codice al tuo telefono (demo: il codice è 123456).</p>
      <form id="otp-form" autocomplete="off">
        <label for="otp">Codice OTP</label>
        <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
        <button type="submit">Conferma</button>
        <div class="error" id="otp-error"></div>
      </form>
    </div>
  </main>
  <script>
    if (localStorage.getItem('demo_stage') !== 'otp') location.replace('index.html');
    document.getElementById('otp-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (document.getElementById('otp').value.trim() === '123456') {
        localStorage.setItem('demo_auth', '1');
        localStorage.removeItem('demo_stage');
        location.href = 'dashboard.html';
      } else {
        document.getElementById('otp-error').textContent = 'Codice errato, riprova.';
      }
    });
  </script>
</body>
</html>
