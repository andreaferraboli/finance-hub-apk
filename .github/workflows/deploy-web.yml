name: Deploy web (GitHub Pages)

# Web app di Finance Hub dal repo privato andreaferraboli/finance-hub, pubblicata sul
# branch gh-pages di questo repo: https://andreaferraboli.github.io/finance-hub-apk/
#
# Uso: gh workflow run deploy-web.yml --repo andreaferraboli/finance-hub-apk [-f ref=main]
# La web app non scrive appConfig/version: minWebVersionCode lo scrive
# scripts/ci/update-app-config.mjs, lanciato dal server dopo la release dell'APK.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag o sha di andreaferraboli/finance-hub'
        required: true
        default: main
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice (repo privato, deploy key in sola lettura)
        uses: actions/checkout@v5
        with:
          repository: andreaferraboli/finance-hub
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.FINANCE_HUB_DEPLOY_KEY }}
          persist-credentials: false

      - name: Versione
        id: ver
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # URL pubblico del proxy Claude (variabile del repo, non un segreto).
          VITE_CLAUDE_PROXY_URL: ${{ vars.VITE_CLAUDE_PROXY_URL }}

      - name: Controlla la base della build
        run: |
          grep -q '/finance-hub-apk/assets/' dist/index.html || { echo "::error::dist/index.html non usa la base /finance-hub-apk/"; exit 1; }
          test -f dist/404.html
          touch dist/.nojekyll

      - name: Pubblica sul branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          full_commit_message: "Deploy web ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.sha }})"

      - name: Avvia la build di Pages
        # Il sito e' "legacy" dal branch gh-pages: si chiede la build esplicitamente nel caso
        # in cui il push col GITHUB_TOKEN non la faccia partire da solo.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status || echo "::warning::richiesta di build di Pages non riuscita"
